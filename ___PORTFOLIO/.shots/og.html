<!DOCTYPE html><html lang="pl"><head><meta charset="utf-8"><link rel="stylesheet" href="http://localhost:8000/css/style.css">
<style>
html,body{margin:0;width:1200px;height:630px;overflow:hidden;background:#09090b}
.og{position:relative;width:1200px;height:630px;padding:72px 80px;box-sizing:border-box;font-family:var(--sans);color:#f5f5f7;display:flex;flex-direction:column;justify-content:space-between}
.og .grid-lines{opacity:.9}
.og .orb{width:900px;height:900px;right:-300px;top:-380px;background:radial-gradient(circle at 50% 50%,rgba(255,90,36,.42),rgba(255,90,36,0) 62%);filter:blur(80px)}
.og .logo{font-size:30px;gap:14px}
.og .logo__mark{width:40px;height:40px}
.og h1{font-size:88px;line-height:.98;letter-spacing:-.045em;font-weight:750;max-width:14ch;position:relative;margin:0}
.og h1 em{font-family:var(--serif);font-style:italic;font-weight:400;color:#ff5a24}
.og .eyebrow{font-size:20px;letter-spacing:.24em;color:#f5f5f7;margin:0}
.og .eyebrow::before{width:40px;height:2px}
.og .foot{position:relative;display:flex;justify-content:space-between;align-items:flex-end;color:#a1a1aa;font-size:22px}
.og .foot b{color:#f5f5f7;font-weight:650}
</style></head><body>
<div class="og">
  <div class="grid-lines" style="position:absolute;inset:0"></div><div class="orb" style="position:absolute"></div>
  <a class="logo" style="position:relative"><svg class="logo__mark" viewBox="0 0 32 32"><circle cx="16" cy="16" r="12.5" fill="none" stroke="currentColor" stroke-width="2.4"/><circle cx="16" cy="16" r="4.2" fill="#ff5a24"/><path d="M16 1v5M16 26v5M1 16h5M26 16h5" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg><span class="logo__word">NOVA<span>FOCUS</span></span></a>
  <div style="position:relative">
    <p class="eyebrow" style="margin-bottom:26px">WEB • ADS • SOCIAL</p>
    <h1>Strony i marketing, które zdobywają <em>klientów.</em></h1>
  </div>
  <div class="foot"><span><b>Strony internetowe</b> • Google Ads • Meta Ads • Social media • Video</span><span>novafocus.pl</span></div>
</div>
</body></html>

<!DOCTYPE html><html lang="pl"><head><meta charset="utf-8"><link rel="stylesheet" href="http://localhost:8000/css/style.css">
<style>
:root{--og-accent:#0878f9;--og-accent-2:#4aa8ff;--og-navy:#0b1f37}
html,body{margin:0;width:1200px;height:630px;overflow:hidden;background:var(--og-navy)}
.og{position:relative;width:1200px;height:630px;padding:72px 80px;box-sizing:border-box;font-family:var(--sans,'Inter',system-ui,sans-serif);color:#fff;display:flex;flex-direction:column;justify-content:space-between;background:linear-gradient(135deg,#0b1f37,#13314f);overflow:hidden}
.og .grid-lines{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px);background-size:56px 56px;-webkit-mask-image:radial-gradient(ellipse 70% 70% at 70% 20%,#000,transparent);mask-image:radial-gradient(ellipse 70% 70% at 70% 20%,#000,transparent)}
.og .orb{position:absolute;width:900px;height:900px;right:-300px;top:-380px;background:radial-gradient(circle at 50% 50%,rgba(8,120,249,.55),rgba(8,120,249,0) 62%);filter:blur(80px)}
.og .logo{position:relative;display:inline-flex;align-items:center;gap:14px;font-size:32px;font-weight:750;letter-spacing:-.02em;color:#fff}
.og .logo i{width:14px;height:14px;border-radius:50%;background:linear-gradient(135deg,var(--og-accent),var(--og-accent-2));display:inline-block}
.og .logo span{font-weight:400;color:rgba(255,255,255,.65);margin-left:2px}
.og h1{font-size:84px;line-height:1;letter-spacing:-.04em;font-weight:750;max-width:15ch;position:relative;margin:0;text-wrap:balance}
.og h1 em{font-family:var(--serif,Georgia,serif);font-style:italic;font-weight:400;color:var(--og-accent-2)}
.og .eyebrow{display:flex;align-items:center;gap:16px;font-size:20px;letter-spacing:.24em;color:#fff;margin:0 0 26px}
.og .eyebrow::before{content:"";width:40px;height:2px;background:var(--og-accent)}
.og .foot{position:relative;display:flex;justify-content:space-between;align-items:flex-end;color:rgba(255,255,255,.65);font-size:22px}
.og .foot b{color:#fff;font-weight:650}
</style></head><body>
<div class="og">
  <div class="grid-lines"></div><div class="orb"></div>
  <div class="logo"><i></i>REWORK<span>agency</span></div>
  <div style="position:relative">
    <p class="eyebrow">STRONY • ADS • SEO</p>
    <h1>Strony internetowe, które zdobywają <em>klientów.</em></h1>
  </div>
  <div class="foot"><span><b>Strony internetowe</b> • Google Ads • Lokalne SEO • Wadowice</span><span>reworkagency.pl</span></div>
</div>
</body></html>

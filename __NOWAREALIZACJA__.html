<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap');
    
    body {
      margin: 0;
      background: #090A0F;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    .story-card {
      width: 1080px;
      height: 1920px;
      background: #0D0F17;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 140px 60px 80px;
      box-sizing: border-box;
    }

    .glow {
      position: absolute;
      width: 700px;
      height: 700px;
      background: radial-gradient(circle, rgba(0, 163, 255, 0.12) 0%, rgba(0, 0, 0, 0) 70%);
      top: 15%;
      left: 50%;
      transform: translate(-50%, -50%);
    }

    .badge-title {
      position: relative;
      font-size: 88px;
      font-weight: 800;
      color: #FFFFFF;
      margin-bottom: 60px;
      letter-spacing: -2px;
    }

    .badge-title::after {
      content: '';
      position: absolute;
      left: 0;
      bottom: 6px;
      width: 100%;
      height: 22px;
      background: #00A3FF;
      z-index: -1;
      border-radius: 4px;
    }

    .link-pill {
      display: flex;
      align-items: center;
      gap: 16px;
      background: #FFFFFF;
      color: #090A0F;
      padding: 24px 48px;
      border-radius: 100px;
      font-size: 36px;
      font-weight: 700;
      margin-bottom: 100px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    /* Miejsce na mockupy / zdjęcia projektu */
    .mockups-container {
      position: relative;
      width: 100%;
      height: 1000px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .mockup-main {
      width: 500px;
      height: 900px;
      background: #1A1D2B;
      border: 8px solid #2A2F45;
      border-radius: 40px;
      box-shadow: 0 30px 60px rgba(0,0,0,0.8);
      position: absolute;
      left: 100px;
      z-index: 2;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #525B70;
      font-size: 28px;
    }

    .mockup-secondary {
      width: 440px;
      height: 800px;
      background: #141724;
      border: 6px solid #202538;
      border-radius: 36px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.6);
      position: absolute;
      right: 100px;
      z-index: 1;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #525B70;
      font-size: 28px;
    }
  </style>
</head>
<body>

  <div class="story-card">
    <div class="glow"></div>

    <div class="badge-title">Nowa realizacja</div>

    <div class="link-pill">
      <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
      Sprawdź projekt
    </div>

    <div class="mockups-container">
      <div class="mockup-main"> <!-- zdjecia musza miec 500px szerokosci i 900px wysokosci-->
        <img src="formockups/mockup5.jpg" alt="Main Mockup">
      </div>
      <div class="mockup-secondary">
        <img src="formockups/mockup6.jpg" alt="Secondary Mockup">
      </div>
    </div>
  </div>

</body>
</html>
